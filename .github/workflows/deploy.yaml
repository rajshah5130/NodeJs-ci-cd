jobs:
  test-connectivity:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: 13.62.104.219
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            echo "=========================================="
            echo "SSH Connection Successful!"
            echo "=========================================="
            echo "Server Info:"
            uname -a
            echo ""
            echo "Current User:"
            whoami
            echo ""
            echo "Current Directory:"
            pwd
            echo ""
            echo "Disk Space:"
            df -h
            echo ""
            echo "Memory Info:"
            free -h
            echo ""
            echo "Network Interfaces:"
            ip addr show

      # - name: Test SCP Upload
      #   uses: appleboy/scp-action@v1
      #   with:
      #     host: 13.62.104.219
      #     username: ubuntu
      #     key: ${{ env.EC2_SSH_KEY }}
      #     source: "README.md"
      #     target: "/tmp/test-upload/"
      #     rm: false

      - name: Verify Upload
        uses: appleboy/ssh-action@v1
        with:
          host: 13.62.104.219
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            echo "Checking uploaded files..."
            ls -la /tmp/test-upload/
            echo "File content verification:"
            head -5 /tmp/test-upload/README.md

      - name: Test Directory Permissions
        uses: appleboy/ssh-action@v1
        with:
          host: 13.62.104.219
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            echo "Testing write permissions to /var/www/..."
            if [ -d "/var/www" ]; then
              echo "Directory /var/www exists"
              ls -ld /var/www
              if [ -w "/var/www" ]; then
                echo "✓ User has write permissions to /var/www"
              else
                echo "✗ User does NOT have write permissions to /var/www"
                echo "You may need to adjust permissions or use a different deployment directory"
              fi
            else
              echo "✗ Directory /var/www does not exist"
              echo "Creating /var/www directory..."
              mkdir -p /var/www || echo "Requires sudo - you may need to set this up manually"
            fi

      - name: Test Node.js and npm
        uses: appleboy/ssh-action@v1
        with:
          host: 13.62.104.219
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            echo "Checking Node.js..."
            if command -v node &> /dev/null; then
              echo "✓ Node.js is installed: $(node --version)"
            else
              echo "✗ Node.js is NOT installed"
            fi
            
            echo ""
            echo "Checking npm..."
            if command -v npm &> /dev/null; then
              echo "✓ npm is installed: $(npm --version)"
            else
              echo "✗ npm is NOT installed"
            fi
            
            echo ""
            echo "Checking PM2..."
            if command -v pm2 &> /dev/null; then
              echo "✓ PM2 is installed: $(pm2 --version)"
            else
              echo "✗ PM2 is NOT installed"
              echo "You may need to install it with: npm install -g pm2"
            fi

      - name: Connectivity Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Connectivity Test Complete!"
          echo "=========================================="
          # echo "✓ SSH Connection: Verified"
          # echo "✓ SCP Upload: Verified"
          echo "Review the logs above for any warnings or errors"
          echo ""
          echo "Next Steps:"
          echo "1. Verify all tests passed"
          echo "2. Check directory permissions if needed"
          echo "3. Install Node.js/npm/PM2 on server if needed"
          echo "4. Run the main deployment pipeline"
